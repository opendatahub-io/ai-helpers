name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  Test:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: pip install pytest -r plugins/odh-jira/skills/aipcc-cve-report/scripts/requirements.txt

    - name: Run tests
      run: make test

    - name: Run AIPCC CVE report regression tests
      run: |
        node --version
        python plugins/odh-jira/skills/aipcc-cve-report/scripts/test_report.py
