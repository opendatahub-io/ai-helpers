name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  Lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Run skillsaw
      uses: stbenjam/skillsaw@8daf5329069961267553829de3064c2c352222b2 # v0.19.0
      with:
        strict: 'true'

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true

    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y shellcheck

    - name: Install Python dependencies
      run: uv pip install --system ruff PyYAML

    - name: Run ruff check
      run: ruff check .

    - name: Run ruff format check
      run: ruff format --check --diff .

    - name: Run shellcheck
      run: find . -name '*.sh' -type f -exec shellcheck {} +

    - name: Check make update generates no changes
      run: |
        make update
        if ! git diff --quiet; then
          echo "ERROR: 'make update' generates uncommitted changes"
          git diff
          exit 1
        fi
