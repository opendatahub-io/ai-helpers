name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  Lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Run skillsaw
      uses: stbenjam/skillsaw@f9819d2de4d69100f8544175d4045f34f0282b66 # v0.17.0
      with:
        strict: 'true'

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        enable-cache: true

    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y shellcheck

    - name: Install Python dependencies
      run: uv pip install --system ruff PyYAML

    - name: Run ruff check
      run: ruff check .

    - name: Run ruff format check
      run: ruff format --check --diff .

    - name: Run shellcheck
      run: find . -name '*.sh' -type f -exec shellcheck {} +

    - name: Check make update generates no changes
      run: |
        make update
        if ! git diff --quiet; then
          echo "ERROR: 'make update' generates uncommitted changes"
          git diff
          exit 1
        fi
